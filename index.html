<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bradley.party</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="logo" href="/">bradley.party</a>
  <span id="mode" hidden>admin</span>
</header>

<main>
  <form id="new" action="/upload.php" method="post" enctype="multipart/form-data" hidden>
    <h2>New post</h2>
    <label>Title <input name="title" maxlength="200" required></label>
    <label>Text <textarea name="content" rows="8" maxlength="20000" required></textarea></label>
    <label>Photo, audio or video <input type="file" name="media" accept="image/*,audio/*,video/*"></label>
    <button type="submit">Publish</button>
  </form>

  <section id="posts" aria-live="polite"><p>Loading posts…</p></section>
</main>

<script>
(async () => {
  const admin = location.pathname.replace(/\/+$/, '') === '/admin';
  if (admin) {
    document.getElementById('new').hidden = false;
    document.getElementById('mode').hidden = false;
  }

  const box = document.getElementById('posts');
  let posts = [];
  try {
    const res = await fetch('/posts.json', { cache: 'no-store' });
    const text = await res.text();
    posts = text.trim() ? JSON.parse(text) : [];
  } catch (e) {
    box.textContent = 'Could not load posts. Refresh to try again.';
    return;
  }

  box.replaceChildren();
  if (!posts.length) {
    box.textContent = admin ? 'No posts yet. Write the first one above.' : 'No posts yet.';
    return;
  }

  for (const p of posts) {
    const post = document.createElement('article');

    const h = document.createElement('h2');
    h.textContent = p.title;

    const when = document.createElement('time');
    when.textContent = p.date;

    post.append(h, when);

    if (p.media && p.media.url) {
      const kind = String(p.media.type || '').split('/')[0];
      let m;
      if (kind === 'image') {
        m = document.createElement('img');
        m.alt = p.title;
        m.loading = 'lazy';
      } else {
        m = document.createElement(kind === 'audio' ? 'audio' : 'video');
        m.controls = true;
        m.preload = 'metadata';
      }
      m.src = p.media.url;
      post.append(m);
    }

    const body = document.createElement('p');
    body.className = 'body';
    body.textContent = p.content;
    post.append(body);

    if (admin) {
      const f = document.createElement('form');
      f.method = 'post';
      f.action = '/delete.php';
      f.addEventListener('submit', (e) => {
        if (!confirm('Delete this post and its media?')) e.preventDefault();
      });
      const id = document.createElement('input');
      id.type = 'hidden';
      id.name = 'id';
      id.value = p.id;
      const b = document.createElement('button');
      b.type = 'submit';
      b.className = 'danger';
      b.textContent = 'Delete post';
      f.append(id, b);
      post.append(f);
    }

    box.append(post);
  }
})();
</script>
</body>
</html>
