<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="darkreader-lock">
<title>bradley.party</title>
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
<header>
  <a class="logo" href="/">bradley.party</a>
  <p class="tag" id="tag">Welcome! Have a look around.</p>
  <a class="viewsite" id="viewsite" href="/" hidden>View the site</a>
</header>

<main>
  <p id="note" class="note" role="status" hidden></p>

  <form id="new" action="/upload.php" method="post" enctype="multipart/form-data" hidden>
    <h2>Write a post</h2>
    <label for="t">Title</label>
    <input id="t" name="title" maxlength="200" required autocomplete="off">
    <label for="c">What’s on your mind?</label>
    <textarea id="c" name="content" rows="6" maxlength="20000" required></textarea>
    <label for="m">Photos, audio or video (optional, pick as many as you like)</label>
    <input id="m" type="file" name="media[]" accept="image/*,audio/*,video/*" multiple>
    <button type="submit" id="go">Publish</button>
  </form>

  <h2 id="listhead" hidden>Your posts</h2>
  <section id="posts" aria-live="polite"><p>Loading posts…</p></section>
</main>

<script>
(async () => {
  const admin = location.pathname.replace(/\/+$/, '') === '/admin';
  const $ = (id) => document.getElementById(id);

  if (admin) {
    document.body.classList.add('admin');
    $('new').hidden = false;
    $('listhead').hidden = false;
    $('viewsite').hidden = false;
    $('tag').textContent = 'Admin';

    const q = new URLSearchParams(location.search);
    let msg = '', cls = '';
    if (q.has('posted'))       { msg = 'Posted! It’s live on the site.'; cls = 'ok'; }
    else if (q.has('deleted')) { msg = 'Post deleted.'; cls = 'ok'; }
    else if (q.get('error'))   { msg = q.get('error'); cls = 'bad'; }
    if (msg) {
      $('note').textContent = msg;
      $('note').className = 'note ' + cls;
      $('note').hidden = false;
      history.replaceState(null, '', '/admin');
    }

    $('new').addEventListener('submit', () => {
      $('go').disabled = true;
      $('go').textContent = 'Posting…';
    });
  }

  function makeImg(url, alt) {
    const m = document.createElement('img');
    m.alt = alt;
    m.loading = 'lazy';
    m.src = url;
    return m;
  }

  function slideshow(images, alt) {
    const wrap = document.createElement('div');
    wrap.className = 'show';
    const img = document.createElement('img');
    img.alt = alt;
    const bar = document.createElement('div');
    bar.className = 'bar';
    const prev = document.createElement('button');
    prev.type = 'button';
    prev.textContent = '« Previous';
    const count = document.createElement('span');
    const next = document.createElement('button');
    next.type = 'button';
    next.textContent = 'Next »';
    let i = 0;
    const go = (n) => {
      i = (n + images.length) % images.length;
      img.src = images[i].url;
      count.textContent = (i + 1) + ' of ' + images.length;
      new Image().src = images[(i + 1) % images.length].url;
    };
    prev.addEventListener('click', () => go(i - 1));
    next.addEventListener('click', () => go(i + 1));
    let x = null;
    img.addEventListener('touchstart', (e) => { x = e.touches[0].clientX; }, { passive: true });
    img.addEventListener('touchend', (e) => {
      if (x === null) return;
      const dx = e.changedTouches[0].clientX - x;
      if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1));
      x = null;
    });
    bar.append(prev, count, next);
    wrap.append(img, bar);
    go(0);
    return wrap;
  }

  const box = $('posts');
  let posts = [];
  try {
    const res = await fetch('/posts.json', { cache: 'no-store' });
    const text = await res.text();
    posts = text.trim() ? JSON.parse(text) : [];
  } catch (e) {
    box.textContent = 'Could not load posts. Refresh to try again.';
    return;
  }

  box.replaceChildren();
  if (!posts.length) {
    box.textContent = admin ? 'No posts yet. Write your first one above!' : 'Nothing here yet. Check back soon!';
    return;
  }

  for (const p of posts) {
    const post = document.createElement('article');
    const h = document.createElement('h2');
    h.textContent = p.title;
    const when = document.createElement('time');
    when.textContent = p.date;
    post.append(h, when);

    if (!admin) {
      const media = !p.media ? [] : (Array.isArray(p.media) ? p.media : [p.media]);
      const isImg = (m) => String(m.type || '').startsWith('image/');
      const images = media.filter(isImg);
      if (images.length === 1) {
        post.append(makeImg(images[0].url, p.title));
      } else if (images.length > 1) {
        post.append(slideshow(images, p.title));
      }
      for (const m of media.filter((m) => !isImg(m))) {
        const el = document.createElement(String(m.type).startsWith('audio/') ? 'audio' : 'video');
        el.controls = true;
        el.preload = 'metadata';
        el.src = m.url;
        post.append(el);
      }
      const body = document.createElement('p');
      body.className = 'body';
      body.textContent = p.content;
      post.append(body);
    } else {
      const f = document.createElement('form');
      f.method = 'post';
      f.action = '/delete.php';
      f.addEventListener('submit', (e) => {
        if (!confirm('Delete this post? This can’t be undone.')) e.preventDefault();
      });
      const id = document.createElement('input');
      id.type = 'hidden';
      id.name = 'id';
      id.value = p.id;
      const b = document.createElement('button');
      b.type = 'submit';
      b.className = 'danger';
      b.textContent = 'Delete';
      f.append(id, b);
      post.append(f);
    }
    box.append(post);
  }
})();
</script>
</body>
</html>
